name: clickstream

# ---------------------------------------------------------------------------
# One command:  docker compose up --build -d
#   kafka (KRaft, no Zookeeper) -> producer -> stream-processor (PySpark)
#   -> ClickHouse -> Superset dashboards
# ---------------------------------------------------------------------------

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-app_pw}
  CLICKHOUSE_DB: clickstream

services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9092:9092"            # for tools running on your own computer
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic clickstream.events
        --partitions 3 --replication-factor 1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"            # HTTP (used by Spark and Superset)
      - "9000:9000"            # native protocol
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql:/docker-entrypoint-initdb.d:ro   # tables are created on first start
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  producer:
    build: ./producer
    image: clickstream-producer
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: clickstream.events
    command:
      - python
      - producer.py
      - --interval
      - "${PRODUCER_INTERVAL:-0.2}"
      - --late-rate
      - "${LATE_RATE:-0.05}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  stream-processor:
    build: ./processor
    image: clickstream-processor
    environment:
      <<: *clickhouse-env
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: clickstream.events
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      WATERMARK: ${WATERMARK:-2 minutes}
      SALES_WINDOW: ${SALES_WINDOW:-5 minutes}
      ACTIVITY_WINDOW: ${ACTIVITY_WINDOW:-10 minutes}
      ACTIVITY_SLIDE: ${ACTIVITY_SLIDE:-1 minute}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-10 seconds}
      SPARK_DRIVER_MEMORY: 1g
    volumes:
      - checkpoints:/checkpoints
    ports:
      - "4040:4040"            # Spark UI (while the job is running)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: on-failure

  superset:
    build: ./superset
    image: clickstream-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-only-change-me-please-0123456789}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - superset_home:/app/superset_home
    command:
      - /bin/bash
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Admin --lastname User
        --email admin@example.com --password admin || true) &&
        superset init &&
        exec /usr/bin/run-server.sh
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  kafka_data:
  clickhouse_data:
  checkpoints:
  superset_home:
